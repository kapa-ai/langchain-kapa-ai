[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[project]
name = "langchain-kapa-ai"
version = "0.1.0"
description = "LangChain retriever and document tool for the Kapa.ai knowledge base."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kapa.ai", email = "engineering@kapa.ai" }]
requires-python = ">=3.10,<4.0"
keywords = ["langchain", "kapa", "retriever", "retrieval", "rag", "knowledge-base", "agents", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1,<1",
    "langchain-core>=1.4.0,<2",
    "pydantic>=2.7.4,<3",
]

[project.urls]
Homepage = "https://docs.kapa.ai/frameworks/langchain/"
Documentation = "https://docs.kapa.ai/frameworks/langchain/reference"
Repository = "https://github.com/kapa-ai/langchain-kapa-ai"
Issues = "https://github.com/kapa-ai/langchain-kapa-ai/issues"
Changelog = "https://github.com/kapa-ai/langchain-kapa-ai/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "langchain-tests==1.1.9",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-socket>=0.7.0,<1",
]
lint = ["ruff>=0.16.10,<0.17"]
typing = ["mypy>=2.4.0,<3"]
examples = [
    "langchain>=1.4.3,<2",
    "langgraph-cli[inmem]>=0.4.32,<0.5",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typing" },
    { include-group = "examples" },
]

[tool.uv]
required-version = ">=0.12.23"
default-groups = ["dev"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["evals/corpus"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "T20", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "T20"]
"examples/**" = ["T20"]
"scripts/**" = ["T20", "S101"]
"evals/**" = ["T20", "S603", "S607"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "examples", "evals", "scripts"]
exclude = ["^evals/corpus/"]

[[tool.mypy.overrides]]
module = ["pytest_socket"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
